name: UpgradeImpact hosted test

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify hosted credential boundary
        env:
          ENDPOINT: ${{ vars.UPGRADE_IMPACT_BETA_ENDPOINT }}
          LICENSE_KEY: ${{ secrets.UPGRADE_IMPACT_BETA_TOKEN }}
        run: |
          status=$(curl --silent --show-error --max-time 15 --output response.json --write-out "%{http_code}" --request POST --header "authorization: Bearer $LICENSE_KEY" --header "content-type: application/json" --data "{}" "$ENDPOINT/v1/analyse")
          test "$status" = "400"
          test "$(jq -r .error.code response.json)" = "invalid_request"
      - uses: mohdrumman1/upgrade-impact@v1-beta.4
        with:
          github-token: ${{ github.token }}
          hosted-endpoint: ${{ vars.UPGRADE_IMPACT_BETA_ENDPOINT }}
          license-key: ${{ secrets.UPGRADE_IMPACT_BETA_TOKEN }}
